name: PR Title

# 校验 PR 标题符合 Conventional Commits；squash 合并后它就是 main 上唯一的 commit，
# release-please 按这条 commit 决定下一个版本号。
# 用 pull_request_target：仓库是公开的，fork 来的 PR 也能拿到只读 token，
# 且始终使用 main 上的这份配置，PR 里改它不影响本次校验。
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      # 不 checkout PR 代码：只读事件载荷里的标题，不执行外来脚本。
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
