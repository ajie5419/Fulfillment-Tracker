name: CI

# 合并前必须全绿。集成测试只连接独立 job 的临时 MySQL 测试库。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      # postinstall 会执行仓库里的脚本，关掉 checkout 凭据持久化
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # postinstall 里跑 nuxt prepare + prisma generate，不需要 .env：数据库连接只在运行时校验
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Quality gate
        run: node scripts/quality-gate.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    name: MySQL integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration_root
          MYSQL_DATABASE: fulfillment_test
          MYSQL_USER: fulfillment
          MYSQL_PASSWORD: integration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=integration_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: mysql://fulfillment:integration_test@127.0.0.1:3306/fulfillment_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Deploy test schema
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm exec prisma migrate deploy
      - name: Integration tests
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm test:integration
