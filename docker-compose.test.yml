services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${FT_TEST_ROOT_PASSWORD:?Generated by test:kiri}
      MYSQL_DATABASE: fulfillment_test
      MYSQL_USER: fulfillment_test
      MYSQL_PASSWORD: ${FT_TEST_PASSWORD:?Generated by test:kiri}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 60
  tests:
    image: ${FT_LOCAL_IMAGE:?Built by test:kiri}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://fulfillment_test:${FT_TEST_PASSWORD:?Generated by test:kiri}@mysql:3306/fulfillment_test
      TEST_DATABASE_URL: mysql://fulfillment_test:${FT_TEST_PASSWORD:?Generated by test:kiri}@mysql:3306/fulfillment_test
      REQUIRE_TEST_DATABASE: '1'
    command: ["sh", "-ec", "pnpm quality:check && pnpm typecheck && pnpm test && pnpm exec prisma migrate deploy && pnpm test:integration"]
volumes:
  database:
