global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [rules.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: application
    static_configs:
      - targets: [fulfillment:9464]
  - job_name: monitoring
    static_configs:
      - targets: [alloy:12345, loki:3100, prometheus:9090, alertmanager:9093, cadvisor:8080, node-exporter:9100]
  - job_name: health
    metrics_path: /probe
    params:
      module: [http_health]
    static_configs:
      - targets: [http://fulfillment:3100/api/health, http://loki:3100/ready, http://alloy:12345/-/ready, http://grafana:3000/api/health]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
