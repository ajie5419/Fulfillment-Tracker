services:
  app:
    image: ${FT_LOCAL_IMAGE:?Built by demo launcher}
    container_name: ft-demo-app
    restart: unless-stopped
    environment:
      FT_CONTAINER_DEMO: '1'
      FT_DEMO_KEEP_DATA: ${FT_DEMO_KEEP_DATA:-1}
      DATABASE_URL: ${FT_DEMO_DATABASE_URL:?Generated by demo launcher}
      FT_DEMO_BRIDGE_SECRET: ${FT_DEMO_BRIDGE_SECRET:?Generated by demo launcher}
    ports:
      - "127.0.0.1:3101:3101"
      - "127.0.0.1:4101:4101"
    volumes:
      - ./certs/localhost.pem:/app/certs/localhost.pem:ro
      - ./certs/localhost-key.pem:/app/certs/localhost-key.pem:ro
      - ./.data/demo/uploads:/app/.data/demo/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get('https://127.0.0.1:3101/api/health',{ca:require('fs').readFileSync('/app/certs/localhost.pem')},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
networks:
  default:
    external: true
    name: ft-demo
