# 本地开发用 MySQL（已有 QMS 本地 MySQL 容器的话可以不用，直接在那里建 fulfillment 库）。
# docker compose -f docker-compose.local.yml up -d
services:
  mysql:
    image: mysql:8.4
    container_name: fulfillment-mysql
    environment:
      MYSQL_ROOT_PASSWORD: local-root
      MYSQL_DATABASE: fulfillment
      MYSQL_USER: fulfillment
      MYSQL_PASSWORD: devpass
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - fulfillment-mysql:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  fulfillment-mysql:
